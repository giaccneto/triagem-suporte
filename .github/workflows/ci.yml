name: Java CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: triagem_teste
          POSTGRES_USER: triagem_teste
          POSTGRES_PASSWORD: triagem_teste
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U triagem_teste -d triagem_teste"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verificar API e persistência isoladas
        env:
          TRIAGEM_TEST_POSTGRES: 'true'
        run: ./mvnw --batch-mode --no-transfer-progress verify
