spring.application.name=triagem-suporte

# Configuracao de ambiente: nao armazene senhas nem tokens neste arquivo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/triagem_suporte}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen3.5:4b}

trello.base-url=https://api.trello.com/1
trello.api-key=${TRELLO_API_KEY}
trello.token=${TRELLO_TOKEN}
trello.lists.financeiro=${TRELLO_LIST_FINANCEIRO}
trello.lists.tecnico=${TRELLO_LIST_TECNICO}
trello.lists.revisao-humana=${TRELLO_LIST_REVISAO_HUMANA}
trello.connect-timeout=2s
trello.read-timeout=5s

logging.pattern.level=%5p [correlationId=%X{correlationId:-}]

# A classificação síncrona usa o RestClient configurado pelo Spring Boot.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=${OLLAMA_READ_TIMEOUT:45s}
spring.ai.retry.max-attempts=1
spring.ai.ollama.init.pull-model-strategy=never
